name: Build Rugby Pro Android APK & iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'brand-kit/**'
      - 'ios-assets/**'
      - '.github/workflows/android_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Kotlin Unit Tests (JVM)
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Release APK (R8 Shrunk)
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Package Release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Rugby-Pro-Max.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rugby-Pro-Max-Android
          path: Rugby-Pro-Max.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build Unsigned iOS App Bundle
        working-directory: ios
        run: |
          xcodebuild -project RugbyProMax.xcodeproj             -scheme RugbyProMax             -sdk iphoneos             -configuration Release             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_IDENTITY=""             build             SYMROOT="$PWD/build"

      - name: Package iOS IPA & Xcode/BrandKit Bundle
        run: |
          mkdir -p Payload
          cp -R ios/build/Release-iphoneos/RugbyProMax.app Payload/
          zip -qry Rugby-Pro-Max-iOS.ipa Payload
          zip -qry Rugby-Pro-Max-iOS-BrandKit.zip ios brand-kit ios-assets

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rugby-Pro-Max-iOS
          path: |
            Rugby-Pro-Max-iOS.ipa
            Rugby-Pro-Max-iOS-BrandKit.zip

  publish-release:
    needs: [build-apk, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Rugby-Pro-Max-Android

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Rugby-Pro-Max-iOS

      - name: Publish APK, iOS IPA & BrandKit to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0-rugby-pro-max
          name: Rugby Pro Max (Android APK + iOS IPA)
          body: |
            - **Android APK (`Rugby-Pro-Max.apk`)**: Release firmada con optimización R8, caché local segura (sin límite 2MB de SQLite), fuentes estáticas compatibles con Android 8–16, partidos en vivo al segundo, camisetas, clima y árbitros.
            - **iPhone / iOS IPA (`Rugby-Pro-Max-iOS.ipa`)**: App nativa SwiftUI + WebKit con ícono oficial y splash cinematográfica (instalar vía AltStore / Sideloadly / Xcode), **o instalación directa en 2 toques desde Safari** en `https://porotoo017.github.io/rugby-intelligence-engine/` (Compartir → Agregar a pantalla de inicio).
            - **Xcode + Brand Kit (`Rugby-Pro-Max-iOS-BrandKit.zip`)**: Proyecto Xcode completo (`ios/`), logo maestro 1024×1024, splashes y `AppIcon.appiconset`.
          files: |
            Rugby-Pro-Max.apk
            Rugby-Pro-Max-iOS.ipa
            Rugby-Pro-Max-iOS-BrandKit.zip
