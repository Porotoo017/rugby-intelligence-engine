name: Build Rugby Pro Android APK & Brand Kit

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'brand-kit/**'
      - 'ios-assets/**'
      - '.github/workflows/android_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Kotlin Unit Tests (JVM)
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Package APK and iOS/BrandKit Bundle
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rugby-Pro-Max.apk
          zip -r Rugby-Pro-Max-iOS-BrandKit.zip brand-kit ios-assets

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rugby-Pro-Max-Artifacts
          path: |
            Rugby-Pro-Max.apk
            Rugby-Pro-Max-iOS-BrandKit.zip

      - name: Publish APK & BrandKit to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0-rugby-pro-max
          name: Rugby Pro Max (Android APK + iOS BrandKit)
          body: |
            - **Android APK (`Rugby-Pro-Max.apk`)**: Arquitectura MVVM (`ui/`, `data/`, `domain/`, `live/`), rediseño Material 3 de lujo, nuevo logo escudo+balón, partidos en vivo estricto, camisetas titular/suplente verificadas, fichas de jugadores y comparador con buscador multi-filtro.
            - **iOS + Brand Kit (`Rugby-Pro-Max-iOS-BrandKit.zip`)**: Logo maestro transparente 1024×1024, splashes 1080×1920 / 1920×1080, monocromos dorado/blanco/oscuro y `AppIcon.appiconset` + `LaunchImage.imageset` para Xcode.
          files: |
            Rugby-Pro-Max.apk
            Rugby-Pro-Max-iOS-BrandKit.zip
