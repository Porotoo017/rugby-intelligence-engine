name: Rugby Intelligence Live Engine

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rugby-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Rugby Intelligence Engine & Sync DB
        run: python3 engine/rugby_engine.py
      - name: Commit updated database, JSON outputs & report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rugby_master.db data/rugby_engine_output.json rugby_engine_output.json data/rugby_teams_history.json data/rugby_competitions.json REPORT_ACTUAL.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(rugby): auto-sync daily news, lineups, fixtures & rosters"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No changes to commit."
          fi
