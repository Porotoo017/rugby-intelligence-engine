<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rugby Pro — Los Pumas, URBA Buenos Aires, Top 14, Mundiales &amp; Seven</title>
  <meta name="description" content="Todo el rugby en una app: Los Pumas XV y 7s, todos los campeonatos y 99 clubes de Buenos Aires (URBA Top 14 a Desarrollo), Top 14 Francia, Seis Naciones, Mundiales, Seven SVNS, noticias y planteles oficiales." />
  <meta name="theme-color" content="#06080d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rugby Pro" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="alternate icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #06080d;
      --surface: #0d121b;
      --surface-2: #131b28;
      --surface-3: #192436;
      --border: rgba(255, 255, 255, 0.085);
      --border-strong: rgba(226, 183, 92, 0.42);
      --border-arg: rgba(56, 189, 248, 0.36);
      --text: #f3f6fb;
      --text-soft: #c7d1e0;
      --text-dim: #8a99ad;
      --gold: #e2b75c;
      --gold-dim: rgba(226, 183, 92, 0.14);
      --sky: #38bdf8;
      --emerald: #10b981;
      --crimson: #f43f5e;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font-display: "Barlow Condensed", sans-serif;
      --font-body: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14.5px;
      line-height: 1.48;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 75% 28% at 50% 0%, rgba(226, 183, 92, 0.06), transparent 72%),
        radial-gradient(ellipse 60% 25% at 85% 6%, rgba(56, 189, 248, 0.05), transparent 65%);
      padding-bottom: calc(70px + var(--safe-bottom));
    }

    button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* Compact 50px Sticky Topbar (strictly within 15% mobile sticky cap) */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 50px;
      background: rgba(6, 8, 13, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }
    .topbar-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border-strong);
      flex-shrink: 0;
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 1.32rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
      line-height: 1;
    }
    .brand-title span { color: var(--gold); }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .action-btn {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), background 0.16s ease, border-color 0.16s ease;
    }
    .action-btn:hover { background: var(--surface-2); border-color: rgba(255, 255, 255, 0.18); }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.primary { background: var(--gold); color: #080b10; border-color: transparent; font-weight: 700; }
    .action-btn.primary:hover { background: #ecc670; }
    .hidden { display: none !important; }

    /* Container & Structural Rhythm */
    .main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 14px 24px;
    }

    .summary-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px 12px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      font-size: 0.78rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    .summary-meta strong { color: var(--text); font-weight: 600; }
    .meta-live { color: #fda4af; font-weight: 700; }
    .meta-arg { color: var(--sky); font-weight: 700; }
    .meta-gold { color: var(--gold); font-weight: 700; }

    /* Search & Interactive Filters (Single-line >=44px touch targets) */
    .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-box {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 0 14px;
      color: var(--text);
      font-size: 0.875rem;
      font-family: inherit;
    }
    .search-box::placeholder { color: var(--text-dim); }

    .filter-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }

    .seg-tab {
      min-height: 42px;
      padding: 0 13px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .seg-tab:hover { color: var(--text); background: var(--surface-2); }
    .seg-tab.active {
      background: var(--surface-2);
      border-color: var(--border-strong);
      color: var(--gold);
      box-shadow: inset 0 1px 0 rgba(226, 183, 92, 0.18);
    }

    .sub-seg {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: var(--surface);
      padding: 4px;
      border-radius: 11px;
      border: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sub-seg::-webkit-scrollbar { display: none; }
    .sub-btn {
      flex: 1;
      min-width: max-content;
      min-height: 38px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-dim);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .sub-btn.active {
      background: var(--surface-3);
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(226, 183, 92, 0.3);
    }

    /* Calibrated Match Card Grid (Zero clipped text or overflowing borders) */
    .cards-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 11px;
    }
    @media (min-width: 780px) {
      .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    }
    @media (min-width: 1140px) {
      .cards-grid.three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .match-card {
      width: 100%;
      min-width: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 14px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.16s ease, background 0.16s ease;
    }
    .match-card:hover { background: var(--surface-2); border-color: rgba(255, 255, 255, 0.16); }
    .match-card:active { transform: scale(0.99); }
    .match-card.is-arg { border-color: var(--border-arg); }
    .match-card.is-live { border-color: rgba(244, 63, 94, 0.45); }

    .card-kicker {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.74rem;
      color: var(--text-dim);
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      min-width: 0;
    }
    .kicker-league {
      font-weight: 600;
      color: var(--gold);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .kicker-state {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .state-live { color: #fda4af; }
    .state-scheduled { color: var(--emerald); }
    .state-finished { color: var(--text-dim); }

    /* Calibrated 2-Row Broadcasting Scoreboard (never crushes team names on 360px Android) */
    .board-rows { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .board-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .team-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .crest-frame {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      padding: 4px;
    }
    .crest-frame.lg { width: 42px; height: 42px; border-radius: 11px; padding: 5px; }
    .crest-frame.sm { width: 26px; height: 26px; border-radius: 7px; padding: 3px; }
    .crest-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .crest-fallback {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--gold);
      letter-spacing: 0.03em;
      line-height: 1;
    }

    .team-info { min-width: 0; flex: 1; }
    .team-name {
      font-weight: 700;
      font-size: 0.94rem;
      color: var(--text);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .team-sub {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-score {
      font-family: var(--font-display);
      font-size: 1.38rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      min-width: 32px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .row-score.muted { font-size: 0.85rem; font-family: var(--font-mono); color: var(--text-dim); font-weight: 600; }
    .row-score.win { color: var(--gold); }

    .card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.74rem;
      color: var(--text-dim);
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      min-width: 0;
    }
    .foot-venue {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .foot-cta { color: var(--gold); font-weight: 600; white-space: nowrap; flex-shrink: 0; }

    /* Los Pumas Hero Pair (Calibrated Headline Sizes & Clean Grid) */
    .hero-pair {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (min-width: 820px) {
      .hero-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    }
    .arg-hero {
      min-width: 0;
      overflow: hidden;
      background: linear-gradient(155deg, rgba(17, 36, 56, 0.65), rgba(13, 18, 27, 0.98));
      border: 1px solid var(--border-arg);
      box-shadow: inset 0 1px 0 rgba(56, 189, 248, 0.14);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .arg-hero.gold-edge {
      background: linear-gradient(155deg, rgba(44, 34, 14, 0.52), rgba(13, 18, 27, 0.98));
      border-color: var(--border-strong);
      box-shadow: inset 0 1px 0 rgba(226, 183, 92, 0.14);
    }
    .arg-hero-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--sky);
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .arg-hero.gold-edge .arg-hero-eyebrow { color: var(--gold); }
    .arg-hero-title {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 2.5vw, 1.65rem);
      font-weight: 800;
      line-height: 1.12;
      text-wrap: balance;
      color: var(--text);
    }
    .hero-matchup {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hero-crests { display: flex; align-items: center; gap: 10px; }
    .arg-hero-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .hero-stat-label { font-size: 0.7rem; color: var(--text-dim); }
    .hero-stat-val {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* Section Headers & Surface Panels */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 18px 0 10px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.01em;
    }
    .section-sub { font-size: 0.76rem; color: var(--text-dim); }

    .surface-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    /* Standings & Ranking Tables (Mobile safe horizontal scroll container) */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .rank-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 340px;
    }
    .rank-table th, .rank-table td {
      padding: 10px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.82rem;
      white-space: nowrap;
    }
    .rank-table th {
      font-size: 0.7rem;
      color: var(--text-dim);
      font-weight: 700;
      background: var(--surface-2);
    }
    .rank-table tr:last-child td { border-bottom: none; }
    .mono-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Club Directory Cards */
    .dir-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    @media (min-width: 760px) {
      .dir-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    }
    @media (min-width: 1120px) {
      .dir-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .team-card {
      width: 100%;
      min-width: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      min-height: 68px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .team-card:hover { background: var(--surface-2); border-color: var(--border-strong); }

    /* News Feed Cards (Calibrated 16:9 image, never stretches) */
    .news-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    @media (min-width: 760px) {
      .news-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    }
    @media (min-width: 1120px) {
      .news-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .news-card {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.16s ease, background 0.16s ease;
    }
    .news-card:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .news-media {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 175px;
      background: linear-gradient(135deg, #0f1726, #090d14);
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .news-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .news-media-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(226, 183, 92, 0.35);
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .news-body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
    .news-meta { font-size: 0.72rem; color: var(--gold); font-weight: 600; }
    .news-meta span { color: var(--text-dim); font-weight: 500; }
    .news-title {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.32;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-summary {
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.42;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-link {
      margin-top: auto;
      padding-top: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--sky);
    }

    /* Compact Bottom Thumb Navigation (56px height) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      background: rgba(6, 8, 13, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }
    .bottom-nav-grid {
      max-width: 780px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      height: 56px;
    }
    .nav-item {
      min-height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-dim);
      font-size: 0.66rem;
      font-weight: 600;
      white-space: nowrap;
      transition: color 0.15s ease;
    }
    .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-item.active { color: var(--gold); }

    /* Bottom Sheet Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-panel {
      width: 100%;
      max-width: 820px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface);
      border-top: 1px solid var(--border-strong);
      border-radius: 22px 22px 0 0;
      padding: 12px 16px calc(24px + var(--safe-bottom));
      animation: sheetUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (min-width: 760px) {
      .sheet-backdrop { align-items: center; padding: 20px; }
      .sheet-panel { border-radius: 20px; border: 1px solid var(--border-strong); max-height: 86vh; }
    }
    @keyframes sheetUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .sheet-handle { width: 40px; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.22); margin: 0 auto 12px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .sheet-section { padding: 12px 0; border-top: 1px solid var(--border); }
    .sheet-section h3 { font-family: var(--font-display); font-size: 1.12rem; font-weight: 700; color: var(--gold); margin-bottom: 8px; }
    .lineups-split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    @media (min-width: 640px) {
      .lineups-split { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
      min-width: 0;
    }
    .player-row:last-child { border-bottom: none; }
    .jersey-num { font-family: var(--font-mono); font-weight: 700; color: var(--gold); min-width: 24px; display: inline-block; }

    .offline-bar {
      position: fixed;
      bottom: calc(64px + var(--safe-bottom));
      left: 14px;
      z-index: 50;
      background: #92400e;
      color: #fff;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    .empty-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 18px;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.875rem;
    }
  </style>
</head>
