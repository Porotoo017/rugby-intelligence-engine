<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rugby Intelligence Pro — Argentina, Naciones, Mundiales &amp; Seven</title>
  <meta name="description" content="Resultados, horarios en Argentina (ART), planteles, entrenadores, estadios y escudos oficiales de URBA Top 14, Los Pumas XV y 7s, Nations Championship, Seis Naciones, Rugby Championship, Mundiales, SVNS Seven y Top 14." />
  <meta name="theme-color" content="#060b09" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rugby Pro" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="alternate icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #060b09;
      --surface: #0d1713;
      --surface-2: #13211b;
      --surface-hover: #182b23;
      --border: rgba(255, 255, 255, 0.085);
      --border-strong: rgba(212, 166, 74, 0.35);
      --text: #f3f7f5;
      --text-dim: #9db0a6;
      --gold: #d4a64a;
      --emerald: #10b981;
      --crimson: #f43f5e;
      --sky: #38bdf8;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font-display: "Barlow Condensed", sans-serif;
      --font-body: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      background-image:
        radial-gradient(ellipse 80% 35% at 50% 0%, rgba(16, 185, 129, 0.09), transparent 70%),
        radial-gradient(ellipse 60% 30% at 85% 15%, rgba(212, 166, 74, 0.06), transparent 65%);
      padding-bottom: calc(74px + var(--safe-bottom));
    }

    button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    /* Sticky Top Bar (Compact 54px) */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 54px;
      background: rgba(6, 11, 9, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }
    .topbar-inner {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      object-fit: cover;
      border: 1px solid rgba(212, 166, 74, 0.45);
      flex-shrink: 0;
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 1.38rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      white-space: nowrap;
      color: var(--text);
    }
    .brand-title span { color: var(--gold); }

    .top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .action-btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.8125rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), background 0.16s ease, border-color 0.16s ease;
    }
    .action-btn:hover { background: var(--surface-2); border-color: rgba(255,255,255,0.16); }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.primary { background: var(--gold); color: #080d0b; border-color: transparent; font-weight: 700; }
    .action-btn.primary:hover { background: #e3b75c; }
    .hidden { display: none !important; }

    .main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 24px; }

    .summary-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.8125rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    .summary-meta strong { color: var(--text); font-weight: 600; }
    .meta-live { color: #fda4af; font-weight: 700; }
    .meta-arg { color: var(--sky); font-weight: 600; }

    .search-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .search-box {
      flex: 1;
      min-height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      color: var(--text);
      font-size: 0.875rem;
      font-family: inherit;
    }
    .search-box::placeholder { color: var(--text-dim); }

    .filter-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }

    .seg-tab {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.8125rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .seg-tab:hover { color: var(--text); background: var(--surface-2); }
    .seg-tab.active { background: var(--surface-2); border-color: var(--gold); color: var(--gold); }

    .sub-seg {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      background: var(--surface);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .sub-btn {
      flex: 1;
      min-width: fit-content;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .sub-btn.active {
      background: var(--surface-2);
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(212, 166, 74, 0.35);
    }

    .cards-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 820px) {
      .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    }

    .match-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      text-align: left;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.16s ease, background 0.16s ease;
    }
    .match-card:hover { background: var(--surface-2); border-color: rgba(255, 255, 255, 0.15); }
    .match-card:active { transform: scale(0.99); }
    .match-card.is-arg { border-color: rgba(56, 189, 248, 0.32); }
    .match-card.is-live { border-color: rgba(244, 63, 94, 0.45); }

    .card-kicker {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      padding-bottom: 9px;
    }
    .kicker-league {
      font-weight: 600;
      color: var(--gold);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .kicker-state {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .state-live { color: #fda4af; }
    .state-scheduled { color: var(--emerald); }
    .state-finished { color: var(--text-dim); }

    .faceoff {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }
    .team-col { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .team-col.away { flex-direction: row-reverse; text-align: right; }

    .crest-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      padding: 4px;
    }
    .crest-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .crest-fallback { font-family: var(--font-display); font-weight: 800; font-size: 0.95rem; color: var(--gold); letter-spacing: 0.03em; }

    .team-info { min-width: 0; }
    .team-name {
      font-weight: 700;
      font-size: 0.9375rem;
      color: var(--text);
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .team-sub {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      font-variant-numeric: tabular-nums;
    }
    .score-num { font-family: var(--font-display); font-size: 1.85rem; font-weight: 800; line-height: 1; letter-spacing: 0.02em; color: var(--text); }
    .score-vs { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 700; color: var(--gold); }
    .score-time { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); margin-top: 3px; }

    .card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--text-dim);
      padding-top: 2px;
    }
    .foot-venue { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .foot-cta { color: var(--gold); font-weight: 600; white-space: nowrap; flex-shrink: 0; }

    /* Argentina Hero Grid */
    .hero-pair {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }
    @media (min-width: 820px) {
      .hero-pair { grid-template-columns: 1fr 1fr; }
    }
    .arg-hero {
      background: linear-gradient(145deg, rgba(14, 34, 46, 0.72), rgba(13, 23, 19, 0.96));
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px;
      padding: 20px;
    }
    .arg-hero.gold-edge {
      background: linear-gradient(145deg, rgba(38, 30, 12, 0.55), rgba(13, 23, 19, 0.96));
      border-color: rgba(212, 166, 74, 0.35);
    }
    .arg-hero-eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--sky);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .arg-hero.gold-edge .arg-hero-eyebrow { color: var(--gold); }
    .arg-hero-title {
      font-family: var(--font-display);
      font-size: clamp(1.55rem, 3.2vw, 2.1rem);
      font-weight: 800;
      line-height: 1.08;
      text-wrap: balance;
      margin-bottom: 8px;
    }
    .arg-hero-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .hero-stat-label { font-size: 0.72rem; color: var(--text-dim); }
    .hero-stat-val { font-size: 0.875rem; font-weight: 700; color: var(--text); margin-top: 2px; font-variant-numeric: tabular-nums; }

    .dir-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 760px) {
      .dir-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .team-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      width: 100%;
      min-height: 68px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .team-card:hover { background: var(--surface-2); border-color: var(--border-strong); }

    .rank-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .rank-table th, .rank-table td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }
    .rank-table th { font-size: 0.75rem; color: var(--text-dim); font-weight: 600; background: var(--surface-2); }
    .rank-table tr:last-child td { border-bottom: none; }
    .mono-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Bottom Thumb Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      background: rgba(6, 11, 9, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }
    .bottom-nav-grid {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 58px;
    }
    .nav-item {
      min-height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-dim);
      font-size: 0.6875rem;
      font-weight: 600;
      transition: color 0.15s ease;
    }
    .nav-item svg { width: 21px; height: 21px; }
    .nav-item.active { color: var(--gold); }

    /* Bottom Sheet Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-panel {
      width: 100%;
      max-width: 820px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface);
      border-top: 1px solid var(--border-strong);
      border-radius: 24px 24px 0 0;
      padding: 12px 18px calc(24px + var(--safe-bottom));
      animation: sheetUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (min-width: 760px) {
      .sheet-backdrop { align-items: center; padding: 20px; }
      .sheet-panel { border-radius: 22px; border: 1px solid var(--border-strong); max-height: 86vh; }
    }
    @keyframes sheetUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .sheet-handle { width: 42px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.22); margin: 0 auto 14px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .sheet-section { padding: 14px 0; border-top: 1px solid var(--border); }
    .sheet-section h3 { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--gold); margin-bottom: 10px; }

    .lineups-split { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 640px) {
      .lineups-split { grid-template-columns: 1fr 1fr; }
    }
    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.8125rem;
    }
    .player-row:last-child { border-bottom: none; }
    .jersey-num { font-family: var(--font-mono); font-weight: 700; color: var(--gold); min-width: 24px; display: inline-block; }

    .offline-bar {
      position: fixed;
      bottom: calc(68px + var(--safe-bottom));
      left: 16px;
      z-index: 50;
      background: #b45309;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .empty-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 20px;
      text-align: center;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="./icons/icon-192.png" alt="Rugby Intelligence Pro" class="brand-logo" referrerpolicy="no-referrer" />
        <span class="brand-title">Rugby<span>Pro</span></span>
      </div>
      <div class="top-actions">
        <button id="installBtn" class="action-btn primary hidden" type="button">Instalar App</button>
        <button id="refreshBtn" class="action-btn" type="button">Actualizar</button>
      </div>
    </div>
  </header>

  <main id="appMain" class="main">
    <div class="empty-box">Cargando partidos oficiales de rugby, planteles y rankings...</div>
  </main>

  <div id="offlineBar" class="offline-bar hidden">Modo sin conexión — mostrando últimos datos guardados</div>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <div class="bottom-nav-grid">
      <button class="nav-item active" data-tab="matches" type="button">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        <span>Partidos</span>
      </button>
      <button class="nav-item" data-tab="argentina" type="button">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Argentina</span>
      </button>
      <button class="nav-item" data-tab="teams" type="button">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Planteles</span>
      </button>
      <button class="nav-item" data-tab="rankings" type="button">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>
        <span>Ranking</span>
      </button>
    </div>
  </nav>

  <div id="detailSheet" class="sheet-backdrop hidden" role="dialog" aria-modal="true">
    <div id="detailPanel" class="sheet-panel"></div>
  </div>

  <script src="./app.js?v=1.0.0"></script>
</body>
</html>
